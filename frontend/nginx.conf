# Nginx web server configuration for the ShopKart frontend service.
# Serves the compiled React single-page app on port 8080 and reverse-proxies /api/ requests to shop-backend:8080.

server {
    # Non-root unprivileged port matching container specification
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression to reduce transfer size for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Lightweight healthcheck endpoint for Docker and Kubernetes probes
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Reverse proxy: forwards all /api/ traffic to the backend service with client headers
    location /api/ {
        proxy_pass http://shop-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing fallback: serves index.html for client-side navigation routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
